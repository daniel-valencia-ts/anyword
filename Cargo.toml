[package]
name = "anyword"
version = "0.2.0"
edition = "2024"
authors = ["Daniel Valencia"]
description = "Get random words from default lists or custom-made ones"
license = "MIT"
repository = "https://github.com/daniel-valencia-ts/anyword"
keywords = ["random", "word", "rand"]
categories = ["development-tools", "data-structures"]

[features]
english = []
spanish = []
french = []

[dependencies]
rand = "0.10.3"
serde = "1.0.229"
serde_json = "1.0.154"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
