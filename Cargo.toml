[package]
name = "anyword"
version = "0.1.0"
edition = "2024"

[features]
defaultdicts = []
english = ["defaultdicts"]
spanish = ["defaultdicts"]

[dependencies]
rand = "0.10.3"
serde = "1.0.229"
serde_json = "1.0.154"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
